[package]
name = "omniconvert_rust_core"
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "OmniConvert Pro Pure-Rust Magic-Byte Inspector, Dijkstra Conversion Graph, and Zip-Bomb-Guarded Local Engine (Zero GPL dependencies)."

[lib]
name = "omniconvert_rust_core"
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
